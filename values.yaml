# Default values for Kurrier.

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

nameOverride: ""
fullnameOverride: ""

upstream:
  # Pin the app/init/migration source used by the migration and bootstrap jobs.
  ref: "v4.0.0"
  archiveUrl: "https://github.com/kurrier-org/kurrier/archive/refs/tags/v4.0.0.tar.gz"

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

config:
  webUrl: "http://localhost:3000"
  nitroPort: 3001
  webPort: 3000
  disableDrive: false
  disableLocalLogin: false
  localTunnelUrl: ""
  docsUrl: "http://docs:3002"
  davUrl: "http://localhost:5232"
  workerUrl: ""
  host: "0.0.0.0"
  searchRebuildOnBoot: false
  customEmailProviders: "[]"
  oidc:
    googleClientId: ""
    issuerUrl: ""
    clientId: ""
    providerName: ""
    scopes: ""
    tokenAuthMethod: ""
    requireVerifiedEmail: ""

secrets:
  existingSecret: ""
  postgresPassword: "replace-with-postgres-password"
  baikalPostgresPassword: "replace-with-baikal-postgres-password"
  redisPassword: "replace-with-redis-password"
  typesenseApiKey: "replace-with-typesense-api-key"
  jwtSecret: "replace-with-jwt-secret-at-least-32-characters"
  appSecretEncryptionKey: "replace-with-app-secret-encryption-key"
  garageRpcSecret: "replace-with-garage-rpc-secret"
  garageAccessKey: "replace-with-garage-access-key"
  garageSecretKey: "replace-with-garage-secret-key"
  baikalEncryptionKey: "replace-with-baikal-encryption-key"
  baikalAdminPasswordHash: "replace-with-baikal-admin-password-hash"
  apiAdminKey: ""
  oidcGoogleClientSecret: ""
  oidcClientSecret: ""

web:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/kurrier-org/kurrier-web
    tag: "v3.9.6"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

worker:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/kurrier-org/kurrier-worker
    tag: "v3.9.6"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  user: postgres
  database: postgres
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

baikalPostgres:
  enabled: true
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  user: baikal
  database: baikal
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

redis:
  enabled: true
  image:
    repository: redis
    tag: "8.2.2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

typesense:
  enabled: true
  image:
    repository: typesense/typesense
    tag: "29.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8108
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

dav:
  enabled: true
  image:
    repository: ckulka/baikal
    tag: nginx
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  config:
    timezone: UTC
    authRealm: BaikalDAV
    inviteFrom: "noreply@example.com"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

garage:
  enabled: true
  image:
    repository: dxflrs/garage
    tag: "v2.3.0"
    pullPolicy: IfNotPresent
  bucket: kurrier-store
  region: garage
  service:
    type: ClusterIP
    s3Port: 3900
    rpcPort: 3901
    webPort: 3902
    adminPort: 3903
  persistence:
    enabled: true
    dataSize: 20Gi
    metaSize: 2Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

migrations:
  enabled: true
  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  downloaderImage:
    repository: alpine
    tag: "3.22"
    pullPolicy: IfNotPresent
  backoffLimit: 3
  ttlSecondsAfterFinished: 600

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kurrier.local
      paths:
        - path: /
          pathType: Prefix
          service: web
  tls: []

gateway:
  enabled: false
  parentRefs: []
  hostnames: []
  annotations: {}
  webPath: /
  dav:
    enabled: false
    hostnames: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1
