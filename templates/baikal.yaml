{{- if .Values.dav.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kurrier.fullname" . }}-dav
  labels:
    {{- include "kurrier.componentLabels" (dict "root" . "component" "dav") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kurrier.componentSelectorLabels" (dict "root" . "component" "dav") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kurrier.componentSelectorLabels" (dict "root" . "component" "dav") | nindent 8 }}
    spec:
      {{- include "kurrier.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: render-config
          image: busybox:1.37
          command:
            - sh
            - -ec
            - |
              mkdir -p /work/config /work/specific
              sed \
                -e "s|\${BAIKAL_POSTGRES_PASSWORD}|${BAIKAL_POSTGRES_PASSWORD}|g" \
                -e "s|\${BAIKAL_ENCRYPTION_KEY}|${BAIKAL_ENCRYPTION_KEY}|g" \
                -e "s|\${BAIKAL_ADMIN_PASSWORD_HASH}|${BAIKAL_ADMIN_PASSWORD_HASH}|g" \
                /config/baikal.yaml.template > /work/config/baikal.yaml
              chown -R 101:101 /work/config /work/specific || true
          env:
            - name: BAIKAL_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kurrier.secretName" . }}
                  key: BAIKAL_POSTGRES_PASSWORD
            - name: BAIKAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kurrier.secretName" . }}
                  key: BAIKAL_ENCRYPTION_KEY
            - name: BAIKAL_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ include "kurrier.secretName" . }}
                  key: BAIKAL_ADMIN_PASSWORD_HASH
          volumeMounts:
            - name: bootstrap
              mountPath: /config
              readOnly: true
            - name: baikal-config
              mountPath: /work/config
            - name: baikal-specific
              mountPath: /work/specific
      containers:
        - name: baikal
          image: {{ include "kurrier.image" (dict "root" . "image" .Values.dav.image) | quote }}
          imagePullPolicy: {{ .Values.dav.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: baikal-config
              mountPath: /var/www/baikal/config
            - name: baikal-specific
              mountPath: /var/www/baikal/Specific
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.dav.resources | nindent 12 }}
      volumes:
        - name: bootstrap
          configMap:
            name: {{ include "kurrier.fullname" . }}-bootstrap
        - name: baikal-config
          emptyDir: {}
        - name: baikal-specific
          {{- if .Values.dav.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kurrier.fullname" . }}-dav-specific
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.dav.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dav.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dav.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kurrier.dav.serviceName" . }}
  labels:
    {{- include "kurrier.componentLabels" (dict "root" . "component" "dav") | nindent 4 }}
spec:
  type: {{ .Values.dav.service.type }}
  ports:
    - name: http
      port: {{ .Values.dav.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kurrier.componentSelectorLabels" (dict "root" . "component" "dav") | nindent 4 }}
{{- end }}
