{{- if and .Values.migrations.enabled .Values.postgres.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kurrier.fullname" . }}-migrate
  labels:
    {{- include "kurrier.componentLabels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "kurrier.componentSelectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "kurrier.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: fetch-migrations
          image: {{ printf "%s:%s" .Values.migrations.downloaderImage.repository .Values.migrations.downloaderImage.tag | quote }}
          imagePullPolicy: {{ .Values.migrations.downloaderImage.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              wget -O /tmp/kurrier.tar.gz {{ .Values.upstream.archiveUrl | quote }}
              mkdir -p /tmp/kurrier /scripts
              tar -xzf /tmp/kurrier.tar.gz -C /tmp/kurrier --strip-components=1
              cp -R /tmp/kurrier/db/init/. /scripts/
              chmod +x /scripts/db-bootstrap.sh
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      containers:
        - name: migrate
          image: {{ include "kurrier.image" (dict "root" . "image" .Values.migrations.image) | quote }}
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          command:
            - /bin/bash
            - /scripts/db-bootstrap.sh
          env:
            - name: PGHOST
              value: {{ include "kurrier.postgres.serviceName" . | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kurrier.secretName" . }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          emptyDir: {}
{{- end }}
