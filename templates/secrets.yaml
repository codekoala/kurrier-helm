{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kurrier.secretName" . }}
  labels:
    {{- include "kurrier.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  BAIKAL_POSTGRES_PASSWORD: {{ .Values.secrets.baikalPostgresPassword | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  DATABASE_RLS_URL: {{ .Values.secrets.databaseRlsUrl | quote }}
  DAV_DATABASE_URL: {{ .Values.secrets.davDatabaseUrl | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  TYPESENSE_API_KEY: {{ .Values.secrets.typesenseApiKey | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  APP_SECRET_ENCRYPTION_KEY: {{ .Values.secrets.appSecretEncryptionKey | quote }}
  GARAGE_RPC_SECRET: {{ .Values.secrets.garageRpcSecret | quote }}
  GARAGE_ACCESS_KEY: {{ .Values.secrets.garageAccessKey | quote }}
  GARAGE_SECRET_KEY: {{ .Values.secrets.garageSecretKey | quote }}
  BAIKAL_ENCRYPTION_KEY: {{ .Values.secrets.baikalEncryptionKey | quote }}
  BAIKAL_ADMIN_PASSWORD_HASH: {{ .Values.secrets.baikalAdminPasswordHash | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.garageAccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.garageSecretKey | quote }}
  API_ADMIN_KEY: {{ .Values.secrets.apiAdminKey | quote }}
  OIDC_GOOGLE_CLIENT_SECRET: {{ .Values.secrets.oidcGoogleClientSecret | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
{{- end }}
