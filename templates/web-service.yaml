{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kurrier.web.serviceName" . }}
  labels:
    {{- include "kurrier.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kurrier.componentSelectorLabels" (dict "root" . "component" "web") | nindent 4 }}
{{- end }}
