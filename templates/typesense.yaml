{{- if .Values.typesense.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kurrier.fullname" . }}-typesense
  labels:
    {{- include "kurrier.componentLabels" (dict "root" . "component" "typesense") | nindent 4 }}
spec:
  serviceName: {{ include "kurrier.typesense.serviceName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kurrier.componentSelectorLabels" (dict "root" . "component" "typesense") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kurrier.componentSelectorLabels" (dict "root" . "component" "typesense") | nindent 8 }}
    spec:
      {{- include "kurrier.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: typesense
          image: {{ include "kurrier.image" (dict "root" . "image" .Values.typesense.image) | quote }}
          imagePullPolicy: {{ .Values.typesense.image.pullPolicy }}
          args:
            - --data-dir
            - /data
            - --api-key=$(TYPESENSE_API_KEY)
            - --enable-cors
          env:
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kurrier.secretName" . }}
                  key: TYPESENSE_API_KEY
          ports:
            - name: http
              containerPort: 8108
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.typesense.resources | nindent 12 }}
  {{- if .Values.typesense.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.typesense.persistence.accessModes | nindent 10 }}
        {{- include "kurrier.storageClass" (dict "root" . "storageClass" .Values.typesense.persistence.storageClass) | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.typesense.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kurrier.typesense.serviceName" . }}
  labels:
    {{- include "kurrier.componentLabels" (dict "root" . "component" "typesense") | nindent 4 }}
spec:
  type: {{ .Values.typesense.service.type }}
  ports:
    - name: http
      port: {{ .Values.typesense.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kurrier.componentSelectorLabels" (dict "root" . "component" "typesense") | nindent 4 }}
{{- end }}
