{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kurrier.fullname" . }}
  labels:
    {{- include "kurrier.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.webPath | quote }}
      backendRefs:
        - name: {{ include "kurrier.web.serviceName" . }}
          port: {{ .Values.web.service.port }}
{{- if .Values.gateway.dav.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kurrier.fullname" . }}-dav
  labels:
    {{- include "kurrier.componentLabels" (dict "root" . "component" "dav") | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.gateway.dav.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "kurrier.dav.serviceName" . }}
          port: {{ .Values.dav.service.port }}
{{- end }}
{{- end }}
