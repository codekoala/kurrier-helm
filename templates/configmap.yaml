apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kurrier.configName" . }}
  labels:
    {{- include "kurrier.labels" . | nindent 4 }}
data:
  WEB_PORT: {{ .Values.config.webPort | quote }}
  WEB_URL: {{ .Values.config.webUrl | quote }}
  NITRO_PORT: {{ .Values.config.nitroPort | quote }}
  DISABLE_DRIVE: {{ .Values.config.disableDrive | quote }}
  DISABLE_LOCAL_LOGIN: {{ .Values.config.disableLocalLogin | quote }}
  LOCAL_TUNNEL_URL: {{ .Values.config.localTunnelUrl | quote }}
  REDIS_HOST: {{ include "kurrier.redis.serviceName" . | quote }}
  REDIS_PORT: {{ .Values.redis.service.port | quote }}
  TYPESENSE_PORT: {{ .Values.typesense.service.port | quote }}
  TYPESENSE_PROTOCOL: "http"
  TYPESENSE_HOST: {{ include "kurrier.typesense.serviceName" . | quote }}
  DOCS_PORT: "3002"
  DOCS_URL: {{ .Values.config.docsUrl | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_PORT: {{ .Values.postgres.service.port | quote }}
  POSTGRES_HOST: {{ include "kurrier.postgres.serviceName" . | quote }}
  SEARCH_REBUILD_ON_BOOT: {{ .Values.config.searchRebuildOnBoot | quote }}
  DAV_URL: {{ .Values.config.davUrl | quote }}
  WORKER_URL: {{ default (printf "http://%s:%v" (include "kurrier.worker.serviceName" .) .Values.worker.service.port) .Values.config.workerUrl | quote }}
  HOST: {{ .Values.config.host | quote }}
  GARAGE_BUCKET: {{ .Values.garage.bucket | quote }}
  S3_ENDPOINT: {{ printf "http://%s:%v" (include "kurrier.garage.serviceName" .) .Values.garage.service.s3Port | quote }}
  S3_BUCKET: {{ .Values.garage.bucket | quote }}
  S3_REGION: {{ .Values.garage.region | quote }}
  S3_FORCE_PATH_STYLE: "true"
  OIDC_GOOGLE_CLIENT_ID: {{ .Values.config.oidc.googleClientId | quote }}
  OIDC_ISSUER_URL: {{ .Values.config.oidc.issuerUrl | quote }}
  OIDC_CLIENT_ID: {{ .Values.config.oidc.clientId | quote }}
  OIDC_PROVIDER_NAME: {{ .Values.config.oidc.providerName | quote }}
  OIDC_SCOPES: {{ .Values.config.oidc.scopes | quote }}
  OIDC_TOKEN_AUTH_METHOD: {{ .Values.config.oidc.tokenAuthMethod | quote }}
  OIDC_REQUIRE_VERIFIED_EMAIL: {{ .Values.config.oidc.requireVerifiedEmail | quote }}
  CUSTOM_EMAIL_PROVIDERS: {{ .Values.config.customEmailProviders | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kurrier.fullname" . }}-bootstrap
  labels:
    {{- include "kurrier.labels" . | nindent 4 }}
data:
  postgres-init.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<SQL
    DO \$\$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'kurrier') THEN
        EXECUTE format('CREATE ROLE kurrier LOGIN PASSWORD %L', '${POSTGRES_PASSWORD}');
      ELSE
        EXECUTE format('ALTER ROLE kurrier LOGIN PASSWORD %L', '${POSTGRES_PASSWORD}');
      END IF;
    END
    \$\$;

    CREATE SCHEMA IF NOT EXISTS auth;
    ALTER SCHEMA public OWNER TO kurrier;
    ALTER SCHEMA auth OWNER TO kurrier;
    GRANT ALL ON SCHEMA public TO kurrier;
    GRANT ALL ON SCHEMA auth TO kurrier;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO kurrier;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA auth TO kurrier;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO kurrier;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA auth TO kurrier;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO kurrier;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO kurrier;
    ALTER DEFAULT PRIVILEGES IN SCHEMA auth GRANT ALL ON TABLES TO kurrier;
    ALTER DEFAULT PRIVILEGES IN SCHEMA auth GRANT ALL ON SEQUENCES TO kurrier;
    SQL
  baikal.yaml.template: |
    system:
        configured_version: 0.10.1
        timezone: {{ .Values.dav.config.timezone }}
        card_enabled: true
        cal_enabled: true
        dav_auth_type: Digest
        admin_passwordhash: ${BAIKAL_ADMIN_PASSWORD_HASH}
        failed_access_message: 'user %u authentication failure for Baikal'
        auth_realm: {{ .Values.dav.config.authRealm }}
        base_uri: ''
        invite_from: {{ .Values.dav.config.inviteFrom }}
    database:
        sqlite_file: /var/www/baikal/Specific/db/db.sqlite
        backend: pgsql
        mysql_host: ''
        mysql_dbname: ''
        mysql_username: ''
        mysql_password: ''
        encryption_key: ${BAIKAL_ENCRYPTION_KEY}
        pgsql_host: {{ include "kurrier.baikalPostgres.serviceName" . }}
        pgsql_dbname: {{ .Values.baikalPostgres.database }}
        pgsql_username: {{ .Values.baikalPostgres.user }}
        pgsql_password: ${BAIKAL_POSTGRES_PASSWORD}
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    consistency_mode = "consistent"
    rpc_bind_addr = "[::]:{{ .Values.garage.service.rpcPort }}"
    rpc_public_addr = "127.0.0.1:{{ .Values.garage.service.rpcPort }}"

    [s3_api]
    s3_region = "{{ .Values.garage.region }}"
    api_bind_addr = "[::]:{{ .Values.garage.service.s3Port }}"

    [s3_web]
    bind_addr = "[::]:{{ .Values.garage.service.webPort }}"
    root_domain = "localhost"

    [admin]
    api_bind_addr = "[::]:{{ .Values.garage.service.adminPort }}"
